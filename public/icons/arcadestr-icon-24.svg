<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
<!-- 24 px layout, manually placed on integer pixel edges -->
<rect width="24" height="24" rx="5" fill="#240634"/>
<path d="M3 17 C3 9 7 5 12 4 C17 5 21 9 21 17" stroke="#06E3E8" stroke-width="2" fill="none"/>
<circle cx="12" cy="3" r="2" fill="#06DEE5" stroke="#F8EEFF" stroke-width="1"/>
<circle cx="3" cy="17" r="2" fill="#06DEE5" stroke="#F8EEFF" stroke-width="1"/>
<circle cx="21" cy="17" r="2" fill="#06DEE5" stroke="#F8EEFF" stroke-width="1"/>
<!-- bold cabinet silhouette: all straight edges align to integer pixel coordinates -->
<path d="M8 6 H16 L18 10 L17 12 V17 L18 20 V22 H6 V20 L7 17 V12 L6 10 Z" fill="#F8EEFF" shape-rendering="crispEdges"/>
<path d="M9 7 H15 L17 10 L16 12 V17 L17 20 V21 H7 V20 L8 17 V12 L7 10 Z" fill="#4B156D" shape-rendering="crispEdges"/>
<g shape-rendering="crispEdges">
<rect x="8" y="8" width="8" height="2" fill="#FFC21B"/>
<rect x="8" y="12" width="8" height="6" fill="#F8EEFF"/>
<rect x="9" y="13" width="6" height="4" fill="#160523"/>
<rect x="7" y="19" width="10" height="1" fill="#F8EEFF"/>
<rect x="10" y="18" width="1" height="1" fill="#FFC21B"/>
<rect x="14" y="18" width="1" height="1" fill="#FFC21B"/>
</g>
<!-- dedicated pixel A, 4 x 4 pixels -->
<g fill="#08F1EE" shape-rendering="crispEdges">
<rect x="11" y="13" width="2" height="1"/>
<rect x="10" y="14" width="1" height="1"/><rect x="13" y="14" width="1" height="1"/>
<rect x="10" y="15" width="4" height="1"/>
<rect x="10" y="16" width="1" height="1"/><rect x="13" y="16" width="1" height="1"/>
</g>
</svg>